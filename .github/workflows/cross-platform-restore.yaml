# Restore a Linux-created project on macOS and Windows.
on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main]
name: cross-platform-restore
permissions: read-all
jobs:
  create-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: Create explicit project
        shell: Rscript {0}
        run: |
          pkgload::load_all()
          project <- file.path(getwd(), "cross-project")
          intent::init(project,
            repos = c(CRAN = "https://cloud.r-project.org"),
            install_self = "never", r_version = FALSE)
          intent::add("glue", project = project)
          stopifnot(intent::verify(project)$ok)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-project
          path: |
            cross-project/DESCRIPTION
            cross-project/renv.lock
  restore-lockfile:
    needs: create-lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: linux-project
          path: cross-project
      - name: Restore and verify uploaded project
        shell: Rscript {0}
        run: |
          pkgload::load_all()
          project <- file.path(getwd(), "cross-project")
          lock <- file.path(project, "renv.lock")
          before <- readBin(lock, "raw", n = file.info(lock)$size)
          intent::sync(project = project)
          result <- intent::verify(project = project)
          print(result)
          stopifnot(result$ok)
          stopifnot("glue" %in% intent::status(project)$locked_packages)
          stopifnot(identical(before, readBin(lock, "raw", n = file.info(lock)$size)))
